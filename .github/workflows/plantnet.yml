name: plantnet
on:
  push:
    paths: ['plantnet/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: identify
        env:
          KEY: ${{ secrets.PLANTNET_KEY }}
        run: |
          rm -rf plantnet/results; mkdir -p plantnet/results
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -s -X POST "https://my-api.plantnet.org/v2/identify/all?api-key=$KEY&lang=en&nb-results=5" \
              -F "images=@$url" -F "organs=auto" -o "plantnet/results/$name.json"
            sleep 1
          done < plantnet/urls.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add plantnet/results; git commit -m "plantnet results" || echo nothing
          git pull --rebase; git push
